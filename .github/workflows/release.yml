name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only; electron-builder needs contents:write to create the release.
permissions:
  contents: write

jobs:
  # electron-builder creates a release when none exists for the tag, and its dmg and zip publishers race:
  # a fresh tag ended up with two duplicate releases holding half the assets each. Creating the release
  # first makes every later publisher an upload only.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release for this version if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
            echo "Created release $TAG."
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      # Sequential: two jobs creating the release for the same tag at once produced two duplicate
      # releases (each with half the assets) and split the electron-updater feed files between them.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest   # Apple Silicon runner -> darwin-arm64 build (x64 needs an Intel runner)
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install dependencies
        run: npm run install:all
      - name: Fetch or build whisper-cli for this platform
        run: npm run setup
      # Code signing is optional until certificates exist. Secrets that are not configured expand to "",
      # and an empty CSC_LINK makes electron-builder look for a certificate file and abort, so the
      # variables are exported only when the secret has a value.
      - name: Configure code signing
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "CSC_LINK=$CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Code signing certificate configured."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing certificate configured; building unsigned."
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
            echo "Apple notarization credentials configured."
          fi
      - name: Build and publish installers to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:dist -- ${{ matrix.args }} --publish always
